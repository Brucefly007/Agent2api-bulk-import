name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python 语法检查
        run: python -m py_compile install.py

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 插件脚本语法检查
        run: node --check bulk-import.js

      - name: 示例 JSON 校验
        run: python -c "import json,io;json.load(io.open('examples/account.example.json',encoding='utf-8'));print('ok')"